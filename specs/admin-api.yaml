components:
  parameters:
    TenantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: '019a0000-0000-7000-8000-000000000001'
  schemas:
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, suspended, trial]
        config:
          type: object
          additionalProperties: true
    TenantCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        data:
          type: object
        created_on:
          type: string
          format: date-time
        started_on:
          type: string
          format: date-time
          nullable: true
        completed_on:
          type: string
          format: date-time
          nullable: true
        tenant_id:
          type: string
          format: uuid
          nullable: true
        tenant_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    WappChannel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        phone_number:
          type: string
          nullable: true
        status:
          type: string
          enum: [connected, disconnected, connecting, qr_pending, qr_expired, waiting_qr]
        config:
          type: object
        created_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
          nullable: true
        session_status:
          type: string
          nullable: true
        qr_code:
          type: string
          nullable: true
        qr_generated_at:
          type: string
          format: date-time
          nullable: true
        qr_scanned_at:
          type: string
          format: date-time
          nullable: true
        qr_scanned_by:
          type: string
          nullable: true
        session_updated_at:
          type: string
          format: date-time
          nullable: true
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        resource_id:
          type: string
        details:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
    Plugin:
      type: object
      required:
      - id
      - name
      - display_name
      - fields
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
          nullable: true
        fields:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
    # [PURGED] TenantRule schema removed — replaced by TenantFlow
    ActivityLog:
      type: object
      required:
      - id
      - tenant_id
      - event_type
      - description
      - metadata
      - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          nullable: true
        flow_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
        description:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
    Contact:
      type: object
      required:
      - id
      - tenant_id
      - display_name
      - metadata
      - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        display_name:
          type: string
        metadata:
          type: object
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ContactAddress'
        created_at:
