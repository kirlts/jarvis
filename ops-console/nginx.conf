server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las rutas de la API van al núcleo, y esto tiene que estar ANTES del fallback de la SPA.
    #
    # Sin este bloque, `/admin/...` caía en el `try_files` de abajo: un GET devolvía el index.html
    # con estado 200 —que se lee como «la API contesta» y no lo es— y un POST devolvía 405, que es
    # lo que rompía el botón de entrada de desarrollo. La consola llama a la API en su mismo
    # origen, así que quien resuelve esas rutas es este nginx.
    #
    # El nombre del servicio se resuelve por la red de Docker; el resolver no hace falta porque
    # está en la misma red y el nombre es estático.
    location /admin/ {
        proxy_pass http://core-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }
    location /auth/ {
        proxy_pass http://core-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable server version exposure
    server_tokens off;
}
